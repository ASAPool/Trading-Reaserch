# Project settings. Plain text, no code.
# Python reads this file with its built-in "tomllib" module (no add-ons needed).

[project]
# Research and simulation only. There is deliberately no setting for live trading.
mode = "research"
scope = "crypto"          # futures are a later expansion, not implemented

[time]
# Every timestamp in the system is stored in UTC, so all markets
# share a single clock and daylight-saving time cannot cause errors.
timezone = "UTC"

[markets.crypto]
symbols = ["BTC", "ETH", "SOL", "XRP"]

[pipeline]
# Phase 3 starts with ONE market and ONE timeframe to verify the pipeline.
first_symbol = "BTC"
first_timeframe = "1h"
# Fixed dataset period, so every re-download produces the same dataset.
# Dates are inclusive and in UTC: the first bar opens 2019-01-01 00:00,
# the last bar opens 2026-09-30 23:00 (for 1-hour bars).
start_date = "2019-01-01"
end_date = "2026-09-30"

# Trading costs (fees, spread, slippage) are intentionally NOT set yet.
# They will be researched and documented in Phase 7, not guessed.

[validation]
# Thresholds for FLAGGING suspicious bars in the Phase 4 validation report.
# They only decide what gets listed for human review. Nothing is ever removed.
max_abs_close_to_close_return = 0.10   # close moved more than 10% from the previous close
max_bar_range = 0.15                   # (high - low) / low wider than 15% within one bar
max_open_vs_prev_close_gap = 0.02      # open more than 2% away from the previous close

[adjudication]
# Cross-checking validation events against an independent SECOND provider.
# These rules were FIXED BEFORE any real comparison results were seen.
# Read-only: second-provider data is never merged into the primary dataset.
second_provider = "bitstamp"
window_hours = 24                       # second-source data fetched +/- this many hours around each event
alignment_min_hours = 100               # normal (unflagged) hours needed to trust that timestamps line up
alignment_max_median_close_diff = 0.005 # median |close difference| between providers must be <= 0.5%
open_close_tolerance = 0.01             # open and close "agree" if within 1% (weighted most heavily)
move_observed_min_ratio = 0.5           # move observed: same direction and >= 50% of the primary's size
move_not_observed_max_ratio = 0.2       # not observed: opposite direction or <= 20% of the primary's size
wick_disagreement_threshold = 0.03      # high or low differ > 3%: tagged separately, candle NOT invalidated

[backtest]
# Phase 5 engine (synthetic data only; real data is LOCKED until the split freeze).
# Starting equity is locked at 10,000 USD. Every trade uses the same fixed
# notional (no compounding); 0 < fixed_notional <= starting_equity (no leverage).
# COSTS NOT MODELLED (Phase 7).
starting_equity = 10000
fixed_notional = 1000
